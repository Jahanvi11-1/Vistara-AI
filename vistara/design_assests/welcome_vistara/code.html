<img class="w-full h-full object-cover" data-alt="A sophisticated, minimalist 3D rendering of abstract geometric paper-like planes layering over each other. The color palette features pristine Lilac White surfaces shifting into soft Lavender Gray shadows, with a single, precise geometric sphere in vibrant Ochre Amber resting on the top layer. The lighting is soft, studio-quality, casting highly diffused, atmospheric shadows that emphasize depth and clarity. The mood is calm, authoritative, and deeply analytical, perfectly capturing a premium editorial SaaS aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHZsnATq5oPL2luNbdjpeRnQeQiixGbM58LauPV0xcWizbA6UiC5qAe02Da7VlmpoqTyxvWkgxO15TOhGmFCw7a4c8_CyhMfhVpMpqexRyC0cotR19bCGMo8VwoA8p0QEyNq3vauOOZbEf18qhepwSNmh0L0wgRcnj9Dm6EKndF8uLEg50s99iDV69Xa2spEv6oxs4w202NGxMEXHH9qbRgPw9FcCCm5053xHgj7XAf0eXUjft5qQ">

<!-- Initial Animation Script for smooth entry -->
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const elements = document.querySelectorAll('h1, p, button, .relative.w-full.aspect-square');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 150 + (index * 100));
            });
        });
    </script>
